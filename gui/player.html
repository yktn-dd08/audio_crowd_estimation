<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio × Trajectory</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#101724;color:#e3eaf5;font:14px system-ui,sans-serif}h1{font-size:21px;margin:0 0 14px}button,select,input{font:inherit}button,select,input[type=number]{background:#24334a;color:#edf4ff;border:1px solid #506079;border-radius:5px;padding:5px 9px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#354965}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}label{display:flex;align-items:center;gap:6px}input[type=file]{max-width:300px}input[type=number]{width:90px}#seek{flex:1;min-width:160px}#time{font-variant-numeric:tabular-nums;min-width:150px}#status{min-height:22px;color:#a9c7e8;white-space:pre-wrap}.error{color:#ffaaa8!important}.plots{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}.panel{background:#182235;border:1px solid #344158;border-radius:9px;padding:10px;min-width:0}.panel header{display:flex;align-items:center;gap:8px;height:30px}.panel header strong{flex:1}.panel canvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}.trajectory{grid-column:2;grid-row:1 / 3}.trajectory canvas{height:492px}.panel:fullscreen{padding:20px;display:flex;flex-direction:column}.panel:fullscreen canvas{height:auto;flex:1;min-height:0}.hint{color:#a4b5cb;font-size:12px;margin:8px 0}details{margin:8px 0}#legend{max-height:75px;overflow:auto;display:flex;flex-wrap:wrap;gap:9px;font-size:12px}#mapping{gap:8px}#mapping select{max-width:160px}@media(max-width:760px){.plots{grid-template-columns:1fr}.trajectory{grid-column:auto;grid-row:auto}.trajectory canvas{height:330px}}
.panel canvas.colorbar{height:54px;flex:0 0 54px;cursor:default;touch-action:auto}
</style></head><body>
<h1>Audio × Trajectory <small style="font-size:13px;color:#9cb5d2">同期プレイヤー</small></h1>
<div class="row"><label>音声 <input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a"></label><label>軌跡CSV <input id="csvFile" type="file" accept=".csv,text/csv"></label></div>
<div id="names" class="hint"></div><div id="audioDetails" class="hint"></div>
<div class="row"><button id="play" disabled>▶ 再生</button><button id="stop" disabled>■ 先頭へ</button><input id="seek" aria-label="再生位置" type="range" min="0" max="1" step="0.001" value="0" disabled><span id="time">0.000 / 0.000 s</span><label>速度 <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><label>音量 <input id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.8" style="width:85px"></label><label>Ch <select id="channel" disabled></select></label></div>
<details><summary>CSVの列・時刻合わせ</summary><div id="mapping" class="row"></div><div class="row"><label>軌跡の開始を遅らせる (秒) <input id="offset" type="number" step="0.1" value="0"></label><label>補間する最大間隔 (秒) <input id="gap" type="number" step="0.1" min="0.001" value="0.5"></label><button id="apply">設定を適用</button></div><div class="hint">音声時刻 = CSV時刻 + オフセット。時刻は秒または日時。欠測区間・別segment間は補間しません。X/Y列を変更してXZ・YZ平面も表示できます。</div></details>
<div id="status" role="status" aria-live="polite">音声とCSVを選択してください。</div>
<div class="plots">
<section class="panel"><header><strong>波形</strong><button data-reset="time">表示リセット</button><button data-full="">拡大</button></header><canvas id="wave" aria-label="音声波形"></canvas></section>
<section class="panel trajectory"><header><strong>軌跡 / 現在位置</strong><button data-reset="xy">表示リセット</button><button data-full="">拡大</button></header><canvas id="trajectory" aria-label="全軌跡と現在位置"></canvas><div id="legend"></div></section>
<section class="panel"><header><strong id="spectrumTitle">スペクトログラム (dB)</strong><button data-reset="time">表示リセット</button><button data-full="">拡大</button></header><form id="spectrumSettings" class="row"><label>表示 <select id="spectrumType"><option value="linear">通常（Hz）</option><option value="mel">メル（128帯域）</option></select></label><label>カラーマップ <select id="colormap"><option value="jet" selected>jet</option><option value="viridis">viridis</option><option value="gray">gray</option><option value="warm">warm（従来）</option></select></label><label>下限 (dB) <input id="dbMin" type="number" step="any" value="-100" required></label><label>上限 (dB) <input id="dbMax" type="number" step="any" value="0" required></label><button type="submit">適用</button></form><div id="dbError" class="error" role="alert"></div><canvas id="spec" aria-label="スペクトログラム"></canvas><canvas id="specColorbar" class="colorbar" aria-label="カラーバー"></canvas></section>
</div><p class="hint">ホイール: 拡大・縮小 ／ ドラッグ: 表示移動 ／ 波形・スペクトログラムをクリック: シーク ／ ダブルクリック: 表示リセット。時間軸は2図で連動します。軌跡の薄線は全経路、丸印は現在位置です。</p>
<script id="payload" type="application/octet-stream">__PLAYER_PAYLOAD__</script><script>/* PLAYER_SCRIPT */</script></body></html>
